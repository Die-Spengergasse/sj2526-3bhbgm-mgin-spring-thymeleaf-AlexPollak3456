<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geräteliste</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2>Geräte</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Bezeichnung</th>
            <th>Typ</th>
            <th>Raum</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${devices}">
            <td th:text="${d.id}"></td>
            <td th:text="${d.designation}"></td>
            <td th:text="${d.type}"></td>
            <td th:text="${d.room}"></td>
            <td>
                <a th:href="@{'/device/edit'(id=${d.id})}">Bearbeiten</a> |
                <a th:href="@{'/device/delete'(id=${d.id})}">Löschen</a> |
                <a th:href="@{'/reservation/list'(deviceId=${d.id})}">Reservierungen</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p>
        <a href="/device/add" class="btn btn-primary">Neues Gerät</a>
        <a href="/reservation/add" class="btn btn-success">Neue Reservierung</a>
    </p>
</div>
</body>
</html>
