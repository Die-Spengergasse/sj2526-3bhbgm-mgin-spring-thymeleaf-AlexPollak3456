spring.application.name=spring_thymeleaf

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use in-memory H2 database for local development
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# If you want to use MySQL instead, comment the H2 settings above and
# provide valid credentials and URL like below:
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.url=jdbc:mysql://localhost:3306/panzer_db
# spring.datasource.username=your_user
# spring.datasource.password=your_password